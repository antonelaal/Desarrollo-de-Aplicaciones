<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrate</title>
    <link href="style.css" rel="stylesheet" type="text/css">
</head>

<body>
    <h1>Regístrate</h1>
    
    <form action="my-handling-form-page" method="post">
        <ul>
            <li>
                <label for="fullname">Nombre Completo:</label>
                <input type="text" id="fullname" name="fullname" minlength="3"
                maxlength="50" pattern="[A-Za-záéíóúñÑ ]+" required>
                <span class="error-message">Mínimo 3 caracteres, solo letras</span>
            </li>
            <li>
                <label for="user">Usuario:</label>
                <input type="text" id="user" name="user_name" minlength="4"
                maxlength="20" pattern="[A-Za-z0-9_]+" required>
                <span class="error-message">Mínimo 4 caracteres, solo letras, números y _</span>
            </li>
            <li>
                <label for="mail">Correo electrónico:</label>
                <input type="email" id="mail" name="user_mail" required>
                <span class="error-message">Ingresa un correo válido</span>
            </li>
            <li>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password"
                minlength="8" maxlength="30" required>
                <span class="error-message">Mínimo 8 caracteres</span>
            </li>
            <li>
                <label for="confirmpassword">Confirmar contraseña:</label>
                <input type="password" id="confirmpassword" name="confirmpassword"
                minlength="8" maxlength="30" required oninput="this.setCustomValidity(
                    this.value !== document.getElementById('password').value ? 
                    'Las contraseñas no coinciden' : '')">
            </li>
            <li class="button">
                <button type="submit">Sign up</button>
            </li>
        </ul>
    </form>
</body>

</html>
